<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WalkLeague</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         margin: 0; min-height: 100vh; color: #0f1a13; background: #f6f8f6;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; padding: 40px 20px; line-height: 1.55; }
  .card { width: 100%; max-width: 520px; background: #fff; border: 1px solid #e4e9e5;
          border-radius: 20px; padding: 40px 32px; box-shadow: 0 10px 40px rgba(10,40,20,.06);
          text-align: center; }
  .logo { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 20px;
          background: linear-gradient(135deg, #0a7d3c, #00c46a);
          display: flex; align-items: center; justify-content: center;
          font-size: 40px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.5px; }
  .tag { color: #4a5751; font-size: 16px; margin: 0 0 28px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.btn { display: block; padding: 14px 18px; border-radius: 12px; text-decoration: none;
          font-weight: 600; font-size: 16px; color: #0a7d3c; background: #eef7f1;
          border: 1px solid #d5e8dd; transition: background .15s ease; }
  a.btn:hover { background: #e3f2ea; }
  .foot { margin-top: 28px; font-size: 13px; color: #7a857f; }
  .foot a { color: #0a7d3c; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🏆</div>
    <h1>WalkLeague</h1>
    <p class="tag">The walking challenge where your steps compete for real prizes. Skill-based, 18+, no purchase necessary.</p>
    <div class="links">
      <a class="btn" href="rules.html">Official Challenge Rules</a>
      <a class="btn" href="terms.html">Terms of Service</a>
      <a class="btn" href="privacy.html">Privacy Policy</a>
    </div>
    <p class="foot">Operated by Tai Zaken · <a href="mailto:support@walkleague.app">support@walkleague.app</a></p>
  </div>
</body>
</html>
