<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join me on WalkLeague</title>
<style>
  :root{ --bg:#0B0E14; --card:#141820; --ink:#fff; --muted:#8496A0; --green:#00FF87; --border:#1F2937; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(800px 420px at 50% -8%, rgba(0,255,135,.10), transparent 70%), var(--bg);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; min-height:100%;
  }
  .card{ width:100%; max-width:420px; text-align:center; }
  .logo{ font-size:56px; line-height:1; }
  h1{ font-size:26px; font-weight:850; margin:16px 0 6px; letter-spacing:-.02em; }
  .who{ color:var(--green); }
  p{ color:var(--muted); font-size:15px; line-height:1.5; max-width:34ch; margin:0 auto; }
  .btns{ display:flex; flex-direction:column; gap:12px; margin-top:26px; }
  a.btn{
    display:block; text-decoration:none; font-weight:800; font-size:16px; padding:15px 18px; border-radius:14px;
  }
  a.primary{ background:var(--green); color:#04120a; box-shadow:0 8px 24px rgba(0,255,135,.28); }
  a.ghost{ background:transparent; color:var(--green); border:1px solid rgba(0,255,135,.4); }
  .fine{ margin-top:22px; font-size:12px; color:var(--border); }
  .fine a{ color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🏁</div>
    <h1><span class="who" id="who">A friend</span> invited you to WalkLeague</h1>
    <p>Race your friends by steps, win trophies, and see who really walks the most. Free.</p>
    <div class="btns">
      <a class="btn primary" id="download" href="#">Download WalkLeague</a>
      <a class="btn ghost" id="openApp" href="#">Already have the app? Open it</a>
    </div>
    <div class="fine">walkleague.app</div>
  </div>
<script>
  (function () {
    var u = new URLSearchParams(location.search).get('u');
    if (u) {
      document.getElementById('who').textContent = '@' + u;
      document.getElementById('openApp').href = 'walkleague://add?u=' + encodeURIComponent(u);
    }
    var STORE = 'https://apps.apple.com/app/walkleague';
    document.getElementById('download').href = STORE;
  })();
</script>
</body>
</html>
